<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标注指南</title>
<style>
  body { margin: 0; background: #12141a; color: #e7e9ee;
         font: 15.5px/1.75 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 100px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 19px; margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid #2d323d; }
  h3 { font-size: 16px; margin: 22px 0 8px; color: #6ea8fe; }
  p, li { color: #c8cdd8; }
  code { background: #1b1e26; border: 1px solid #2d323d; border-radius: 4px; padding: 1px 5px;
         font: 13px ui-monospace, monospace; color: #9fd0ff; }
  blockquote { margin: 14px 0; padding: 10px 16px; border-left: 3px solid #3a6ed0;
               background: #1b1e26; color: #a8b0c0; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { border: 1px solid #2d323d; padding: 7px 11px; text-align: left; }
  th { background: #1b1e26; color: #98a0b0; font-weight: 600; }
  hr { border: 0; border-top: 1px solid #2d323d; margin: 30px 0; }
  a { color: #6ea8fe; }
  .back { position: fixed; top: 16px; right: 20px; background: #1b1e26; border: 1px solid #2d323d;
          border-radius: 7px; padding: 6px 13px; font-size: 13px; text-decoration: none; }
  ul { padding-left: 22px; }
  strong { color: #e7e9ee; }
</style>
</head>
<body>
<a class="back" href="/">← 回到标注</a>
<div class="wrap" id="content">加载中…</div>
<script>
// 极简 markdown 渲染（只处理指南里实际用到的语法）
function render(md) {
  const lines = md.split('\n');
  const out = [];
  let inTable = false, inList = false;
  const inline = (s) => s
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
  const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
  const closeTable = () => { if (inTable) { out.push('</table>'); inTable = false; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\|/.test(line)) {
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      const cells = line.split('|').slice(1, -1).map(c => inline(c.trim()));
      if (!inTable) { closeList(); out.push('<table>'); inTable = true;
        out.push('<tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr>'); continue; }
      out.push('<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>');
      continue;
    }
    closeTable();
    if (/^#{1,4} /.test(line)) {
      closeList();
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.replace(/^#+ /, ''))}</h${level}>`);
    } else if (/^> /.test(line)) {
      closeList(); out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`);
    } else if (/^[-*] /.test(line)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inline(line.slice(2))}</li>`);
    } else if (/^---+$/.test(line)) {
      closeList(); out.push('<hr>');
    } else if (!line) {
      closeList();
    } else {
      closeList(); out.push(`<p>${inline(line)}</p>`);
    }
  }
  closeList(); closeTable();
  return out.join('\n');
}
fetch('/api/guideline').then(r => r.json())
  .then(d => document.getElementById('content').innerHTML = render(d.markdown));
</script>
</body>
</html>
